<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>pieces — rika salhi</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <a class="back page-link" href="/">← back</a>

  <main class="gallery">

    <figure>
      <img
        class="signature"
        src="images/signature.jpeg"
        alt=""
      >
    </figure>

    <figure>
      <img
        class="landscape gallery-image"
        src="images/arch.jpeg"
        alt=""
      >
      <figcaption>washington sq.</figcaption>
    </figure>

    <figure>
      <img
        class="square gallery-image"
        src="images/bluebanisters.webp"
        alt=""
      >
      <figcaption>living legend</figcaption>
    </figure>

    <figure>
      <img
        class="portrait gallery-image"
        src="images/dog.jpeg"
        alt=""
      >
      <figcaption>2024</figcaption>
    </figure>

    <figure>
      <img
        class="landscape gallery-image"
        src="images/walking.jpg"
        alt=""
      >
      <figcaption>miu miu fall 1997</figcaption>
    </figure>

    <figure>
      <img
        class="landscape gallery-image"
        src="images/drinks.png"
        alt=""
      >
      <figcaption>&lt; 3</figcaption>
    </figure>

    <figure>
      <img
        class="portrait gallery-image"
        src="images/rainy.jpeg"
        alt=""
      >
      <figcaption>new york</figcaption>
    </figure>

    <figure>
      <img
        class="portrait gallery-image"
        src="images/mirror.webp"
        alt=""
      >
      <figcaption>mirror by sylvia plath</figcaption>
    </figure>

    <figure>

      <video
        class="landscape gallery-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
      >
        <source src="images/nfr.mp4" type="video/mp4">
        Your browser does not support this video.
      </video>

      <figcaption>love song // lana del rey</figcaption>

    </figure>

    <figure>
      <img
        class="square gallery-image"
        src="images/sisyphus.jpeg"
        alt=""
      >
      <figcaption>the myth of sisyphus</figcaption>
    </figure>

    <figure>
      <img
        class="square gallery-image"
        src="images/immunity.png"
        alt=""
      >
      <figcaption>clairo</figcaption>
    </figure>

    <figure>
      <img
        class="portrait gallery-image"
        src="images/hollis.jpeg"
        alt=""
      >
      <figcaption>teenage soldier</figcaption>
    </figure>

    <figure>
      <img
        class="landscape gallery-image"
        src="images/imperial.jpeg"
        alt=""
      >
      <figcaption>theatre district, nyc</figcaption>
    </figure>

    <figure>
      <img
        class="portrait gallery-image"
        src="images/uv.jpeg"
        alt=""
      >
      <figcaption>ultraviolence</figcaption>
    </figure>

    <figure>
      <img
        class="portrait gallery-image"
        src="images/rick.jpeg"
        alt=""
      >
      <figcaption>30 howard st, new york, ny 10013</figcaption>
    </figure>

    <figure>
      <img
        class="landscape gallery-image"
        src="images/screens.jpeg"
        alt=""
      >
      <figcaption>stark</figcaption>
    </figure>

  </main>

  <div class="lightbox" id="lightbox">

    <button
      class="lightbox-close"
      type="button"
      aria-label="Close image"
    >
      ×
    </button>

    <img
      id="lightbox-image"
      src=""
      alt=""
    >

  </div>

  <script src="script.js"></script>

</body>
</html>
